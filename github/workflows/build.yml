name: Krach bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Symbol erzeugen
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          python tools/make_icon.py

      - name: EXE bauen
        shell: pwsh
        run: |
          dotnet publish src/Krach/Krach.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$env:APP_VERSION -o publish 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Installer bauen
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVer=$env:APP_VERSION installer\Krach.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: ZIP packen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item publish/Krach.exe out/Krach.exe
          Compress-Archive -Path publish/Krach.exe, ANLEITUNG.md -DestinationPath out/Krach-portable.zip -Force

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Krach ${{ env.APP_VERSION }}
          make_latest: true
          body: "Krach Soundboard – entwickelt von Erlin Ramaj. Krach-Setup.exe = Installer, Krach.exe = einfach starten."
          files: |
            out/Krach.exe
            out/Krach-portable.zip
            out/Krach-Setup.exe

      - name: Fehlerbericht anlegen
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $lines = @()
          if (Test-Path build.log) { $lines = Select-String -Path build.log -Pattern "error" | Select-Object -First 60 | ForEach-Object { $_.Line } }
          if ($lines.Count -eq 0 -and (Test-Path build.log)) { $lines = Get-Content build.log -Tail 60 }
          Set-Content -Path issue.md -Value ("Build fehlgeschlagen:`n`n" + ($lines -join "`n")) -Encoding utf8
          gh issue create --title "Build ${{ github.run_number }} fehlgeschlagen" --body-file issue.md
